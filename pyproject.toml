[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-project-health-monitor"
version = "0.1.0"
description = "Deterministic project expectation checks from explicit inputs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sphm = "sparrow_project_health_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["sparrow_project_health_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
